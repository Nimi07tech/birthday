<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="coverBg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#2a1435"/>
      <stop offset="45%" stop-color="#150a1d"/>
      <stop offset="100%" stop-color="#07040a"/>
    </radialGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff5fa" stop-opacity="1"/>
      <stop offset="40%" stop-color="#ffb6c1" stop-opacity="0.6"/>
      <stop offset="80%" stop-color="#d8b4e2" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#d8b4e2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9ebb"/>
      <stop offset="50%" stop-color="#ff4d79"/>
      <stop offset="100%" stop-color="#a61c47"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2b3"/>
      <stop offset="100%" stop-color="#f5ba42"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" rx="24" fill="url(#coverBg)"/>
  
  <!-- Subtle Vinyl Rings -->
  <circle cx="300" cy="300" r="260" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1.5"/>
  <circle cx="300" cy="300" r="230" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <circle cx="300" cy="300" r="200" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1.5"/>
  <circle cx="300" cy="300" r="170" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Romantic Moon Glow -->
  <circle cx="300" cy="230" r="140" fill="url(#moonGlow)"/>
  <circle cx="300" cy="230" r="75" fill="#fff9fc" filter="url(#glow)" opacity="0.95"/>
  <circle cx="320" cy="220" r="70" fill="#1b0e24" opacity="0.88"/>

  <!-- Dreamy Clouds / Nebula -->
  <path d="M120 380 Q180 320 280 340 Q380 310 480 370 Q540 400 480 430 Q360 460 240 440 Q140 430 120 380 Z" fill="#ff7597" opacity="0.18" filter="url(#glow)"/>
  <path d="M160 410 Q240 360 360 380 Q440 370 470 420 Q380 470 260 460 Q180 450 160 410 Z" fill="#b982d6" opacity="0.25" filter="url(#glow)"/>

  <!-- Starlit Sparkles -->
  <g fill="#fff" opacity="0.8">
    <circle cx="150" cy="140" r="2"/>
    <circle cx="220" cy="100" r="1.5"/>
    <circle cx="380" cy="120" r="2.5"/>
    <circle cx="450" cy="160" r="1.5"/>
    <circle cx="480" cy="90" r="2"/>
    <circle cx="120" cy="240" r="1.5"/>
    <circle cx="470" cy="280" r="2"/>
    <!-- 4-point sparkle -->
    <path d="M380 120 Q380 135 370 135 Q380 135 380 150 Q380 135 390 135 Q380 135 380 120" fill="url(#goldGrad)"/>
    <path d="M180 200 Q180 210 172 210 Q180 210 180 220 Q180 210 188 210 Q180 210 180 200" fill="#ffb6c1"/>
    <path d="M430 220 Q430 230 422 230 Q430 230 430 240 Q430 230 438 230 Q430 230 430 220" fill="#ffd1b3"/>
  </g>

  <!-- Floating Hearts & Rose Petals -->
  <g fill="url(#roseGrad)">
    <!-- Heart 1 -->
    <path d="M280,310 C280,300 265,290 255,302 C245,290 230,300 230,310 C230,325 255,340 255,340 C255,340 280,325 280,310 Z" transform="rotate(-15 255 315) scale(0.9)" opacity="0.85"/>
    <!-- Heart 2 -->
    <path d="M360,330 C360,322 348,314 340,323 C332,314 320,322 320,330 C320,342 340,355 340,355 C340,355 360,342 360,330 Z" transform="rotate(20 340 335) scale(0.7)" opacity="0.8"/>
    <!-- Petals -->
    <ellipse cx="210" cy="370" rx="14" ry="7" transform="rotate(35 210 370)" fill="#ff8da9" opacity="0.75"/>
    <ellipse cx="390" cy="360" rx="16" ry="8" transform="rotate(-25 390 360)" fill="#ff6b95" opacity="0.8"/>
    <ellipse cx="300" cy="390" rx="12" ry="6" transform="rotate(10 300 390)" fill="#ffb3c6" opacity="0.85"/>
  </g>

  <!-- Typography -->
  <text x="300" y="490" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Outfit', sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="4">PERFECT</text>
  <text x="300" y="525" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="18" font-weight="500" fill="#ffb6c1" letter-spacing="3">ED SHEERAN</text>
  <text x="300" y="555" text-anchor="middle" font-family="'Caveat', cursive, sans-serif" font-size="16" fill="rgba(255,255,255,0.6)">dedicated to sanjana 💗</text>
</svg>
