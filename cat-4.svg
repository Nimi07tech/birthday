<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="catGlow4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a8dadc" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#a8dadc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff9d6"/>
      <stop offset="100%" stop-color="#ffd166"/>
    </linearGradient>
    <filter id="starGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Aura Glow -->
  <circle cx="200" cy="200" r="180" fill="url(#catGlow4)"/>

  <!-- Twinkling Stars in Background -->
  <!-- Star 1 (Top Left) -->
  <path d="M70,80 Q70,100 50,100 Q70,100 70,120 Q70,100 90,100 Q70,100 70,80" fill="#ffd166" filter="url(#starGlow)"/>
  <!-- Star 2 (Top Right) -->
  <path d="M330,70 Q330,88 312,88 Q330,88 330,106 Q330,88 348,88 Q330,88 330,70" fill="#ffd166" filter="url(#starGlow)"/>
  <!-- Star 3 (Bottom Left) -->
  <path d="M80,290 Q80,305 65,305 Q80,305 80,320 Q80,305 95,305 Q80,305 80,290" fill="#ffb6c1"/>
  <!-- Star 4 (Bottom Right) -->
  <path d="M320,300 Q320,318 302,318 Q320,318 320,336 Q320,318 338,318 Q320,318 320,300" fill="#ffd166" filter="url(#starGlow)"/>

  <!-- Kawaii Minty-White Cat (Center) -->
  <g transform="translate(130, 120)">
    <!-- Tail (Curling up excitedly) -->
    <path d="M120,150 Q160,110 145,70 Q135,45 115,65 Q105,85 118,120" fill="none" stroke="#e8f8f5" stroke-width="24" stroke-linecap="round"/>
    <path d="M120,150 Q160,110 145,70 Q135,45 115,65 Q105,85 118,120" fill="none" stroke="#a8dadc" stroke-width="4" stroke-dasharray="6,6" stroke-linecap="round"/>

    <!-- Body -->
    <ellipse cx="70" cy="150" rx="58" ry="52" fill="#e8f8f5"/>
    <ellipse cx="70" cy="155" rx="38" ry="34" fill="#f4fbf9"/>

    <!-- Feet -->
    <ellipse cx="40" cy="195" rx="15" ry="11" fill="#ffffff" stroke="#c0e8e0" stroke-width="2"/>
    <ellipse cx="100" cy="195" rx="15" ry="11" fill="#ffffff" stroke="#c0e8e0" stroke-width="2"/>

    <!-- Head -->
    <ellipse cx="70" cy="70" rx="58" ry="50" fill="#e8f8f5"/>

    <!-- Ears -->
    <!-- Left Ear -->
    <path d="M25,40 Q30,-10 60,20 Z" fill="#e8f8f5"/>
    <path d="M33,36 Q37,5 54,22 Z" fill="#bcece0"/>
    <!-- Right Ear -->
    <path d="M80,20 Q110,-10 115,40 Z" fill="#e8f8f5"/>
    <path d="M86,22 Q103,5 107,36 Z" fill="#bcece0"/>

    <!-- Star Wand Held in Left Paw -->
    <g transform="translate(-15, 30) rotate(-20 50 50)">
      <line x1="50" y1="120" x2="50" y2="40" stroke="#f5ba42" stroke-width="4" stroke-linecap="round"/>
      <!-- Star on wand tip -->
      <polygon points="50,20 55,34 70,34 58,43 62,57 50,48 38,57 42,43 30,34 45,34" fill="url(#wandGrad)" filter="url(#starGlow)"/>
      <circle cx="50" cy="38" r="4" fill="#ffffff"/>
    </g>

    <!-- Paws -->
    <ellipse cx="32" cy="120" rx="13" ry="10" fill="#ffffff" stroke="#c0e8e0" stroke-width="2"/>
    <ellipse cx="98" cy="115" rx="13" ry="10" fill="#ffffff" stroke="#c0e8e0" stroke-width="2"/>

    <!-- Big Excited Sparkly Eyes -->
    <ellipse cx="48" cy="68" rx="9" ry="13" fill="#143632"/>
    <circle cx="45" cy="63" r="4.5" fill="#ffffff"/>
    <circle cx="52" cy="73" r="2" fill="#ffffff"/>

    <ellipse cx="92" cy="68" rx="9" ry="13" fill="#143632"/>
    <circle cx="89" cy="63" r="4.5" fill="#ffffff"/>
    <circle cx="96" cy="73" r="2" fill="#ffffff"/>

    <!-- Cheeks -->
    <ellipse cx="34" cy="80" rx="11" ry="6" fill="#ff9ebb" opacity="0.65"/>
    <ellipse cx="106" cy="80" rx="11" ry="6" fill="#ff9ebb" opacity="0.65"/>

    <!-- Nose & Cat Mouth :3 -->
    <polygon points="67,76 73,76 70,80" fill="#ff7597"/>
    <path d="M64,81 Q70,87 70,81 Q70,87 76,81" fill="none" stroke="#1d4a44" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Whiskers -->
    <line x1="24" y1="76" x2="6" y2="72" stroke="#a8dadc" stroke-width="2" stroke-linecap="round"/>
    <line x1="22" y1="84" x2="4" y2="88" stroke="#a8dadc" stroke-width="2" stroke-linecap="round"/>
    <line x1="116" y1="76" x2="134" y2="72" stroke="#a8dadc" stroke-width="2" stroke-linecap="round"/>
    <line x1="118" y1="84" x2="136" y2="88" stroke="#a8dadc" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Sparkle Particle Trail -->
  <g fill="#ffd166">
    <circle cx="160" cy="80" r="3"/>
    <circle cx="180" cy="60" r="2"/>
    <circle cx="210" cy="90" r="2.5"/>
    <circle cx="140" cy="140" r="3.5"/>
    <circle cx="260" cy="130" r="2"/>
    <circle cx="220" cy="270" r="3"/>
  </g>
</svg>
