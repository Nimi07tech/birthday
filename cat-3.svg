<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="catGlow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7597" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ff7597" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9ebb"/>
      <stop offset="50%" stop-color="#ff4d79"/>
      <stop offset="100%" stop-color="#cc2952"/>
    </linearGradient>
    <filter id="heartGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Aura Glow -->
  <circle cx="200" cy="200" r="180" fill="url(#catGlow3)"/>

  <!-- Floating Hearts in Background -->
  <!-- Heart 1 (Top Left) -->
  <path d="M80,90 C80,75 60,65 48,80 C36,65 16,75 16,90 C16,110 48,130 48,130 C48,130 80,110 80,90 Z" fill="url(#heartGrad)" transform="rotate(-15 48 100) scale(0.9)" opacity="0.85" filter="url(#heartGlow)"/>
  <!-- Heart 2 (Top Right) -->
  <path d="M360,80 C360,68 344,58 334,70 C324,58 308,68 308,80 C308,96 334,115 334,115 C334,115 360,96 360,80 Z" fill="url(#heartGrad)" transform="rotate(20 334 90) scale(0.85)" opacity="0.85" filter="url(#heartGlow)"/>
  <!-- Heart 3 (Bottom Left) -->
  <path d="M70,300 C70,288 56,280 48,290 C40,280 26,288 26,300 C26,314 48,330 48,330 C48,330 70,314 70,300 Z" fill="url(#heartGrad)" transform="rotate(10 48 305) scale(0.7)" opacity="0.8"/>
  <!-- Heart 4 (Bottom Right) -->
  <path d="M370,290 C370,275 350,265 338,280 C326,265 306,275 306,290 C306,310 338,330 338,330 C338,330 370,310 370,290 Z" fill="url(#heartGrad)" transform="rotate(-18 338 300) scale(0.95)" opacity="0.9" filter="url(#heartGlow)"/>

  <!-- Kawaii Peach Floating Cat (Center) -->
  <g transform="translate(130, 110)">
    <!-- Floating Paws Clutched in Cute Hug -->
    <!-- Tail (Curled in air) -->
    <path d="M70,170 Q140,190 145,130 Q150,90 125,110 Q110,120 115,145" fill="none" stroke="#ffe8df" stroke-width="24" stroke-linecap="round"/>
    <path d="M70,170 Q140,190 145,130 Q150,90 125,110 Q110,120 115,145" fill="none" stroke="#ffbca6" stroke-width="4" stroke-dasharray="6,6" stroke-linecap="round"/>

    <!-- Body -->
    <ellipse cx="70" cy="140" rx="58" ry="52" fill="#ffe8df"/>
    <ellipse cx="70" cy="145" rx="40" ry="36" fill="#fff5f0"/>

    <!-- Head -->
    <ellipse cx="70" cy="65" rx="56" ry="48" fill="#ffe8df"/>

    <!-- Ears -->
    <!-- Left Ear -->
    <path d="M26,38 Q32,-10 60,18 Z" fill="#ffe8df"/>
    <path d="M34,35 Q38,5 54,20 Z" fill="#ffbca6"/>
    <!-- Right Ear -->
    <path d="M80,18 Q108,-10 114,38 Z" fill="#ffe8df"/>
    <path d="M86,20 Q102,5 106,35 Z" fill="#ffbca6"/>

    <!-- Loving Closed Happy Eyes (^  ^) -->
    <path d="M42,58 Q52,46 62,58" fill="none" stroke="#381920" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M78,58 Q88,46 98,58" fill="none" stroke="#381920" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Big Soft Cheeks -->
    <ellipse cx="36" cy="68" rx="12" ry="7" fill="#ff8da9" opacity="0.7"/>
    <ellipse cx="104" cy="68" rx="12" ry="7" fill="#ff8da9" opacity="0.7"/>

    <!-- Nose & Happy Open Smile -->
    <polygon points="67,65 73,65 70,69" fill="#ff5c8a"/>
    <path d="M64,70 Q70,82 76,70 Z" fill="#ff4d79"/>

    <!-- Paws Holding a Glowing Heart -->
    <ellipse cx="44" cy="120" rx="14" ry="11" fill="#ffffff" stroke="#ffbca6" stroke-width="2"/>
    <ellipse cx="96" cy="120" rx="14" ry="11" fill="#ffffff" stroke="#ffbca6" stroke-width="2"/>

    <!-- Heart in Paws -->
    <path d="M70,95 C70,85 55,75 45,88 C35,75 20,85 20,95 C20,110 45,128 45,128 C45,128 70,110 70,95 Z" fill="url(#heartGrad)" transform="translate(25, 20) scale(0.7)" filter="url(#heartGlow)"/>

    <!-- Little Cute Wings (Angel Kitty) -->
    <path d="M12,120 Q-25,90 0,65 Q15,75 14,100 Z" fill="#ffffff" opacity="0.85"/>
    <path d="M128,120 Q165,90 140,65 Q125,75 126,100 Z" fill="#ffffff" opacity="0.85"/>

    <!-- Whiskers -->
    <line x1="22" y1="68" x2="4" y2="64" stroke="#ffbca6" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="76" x2="2" y2="80" stroke="#ffbca6" stroke-width="2" stroke-linecap="round"/>
    <line x1="118" y1="68" x2="136" y2="64" stroke="#ffbca6" stroke-width="2" stroke-linecap="round"/>
    <line x1="120" y1="76" x2="138" y2="80" stroke="#ffbca6" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Sparkles -->
  <g fill="#ffd166">
    <circle cx="120" cy="70" r="3"/>
    <circle cx="280" cy="80" r="2.5"/>
    <circle cx="290" cy="270" r="3"/>
    <circle cx="110" cy="270" r="2"/>
  </g>
</svg>
