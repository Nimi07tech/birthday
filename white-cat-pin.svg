<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <radialGradient id="catAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7597" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#ff4d79" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ff4d79" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hatGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </radialGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Aura Glow behind cat -->
  <circle cx="120" cy="120" r="105" fill="url(#catAura)"/>

  <!-- Fluffy White Cat Body -->
  <g transform="translate(45, 45)">
    <!-- Fluffy Tail -->
    <path d="M125,120 Q160,105 145,70 Q135,50 115,65 Q105,80 115,105" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round"/>
    <path d="M125,120 Q160,105 145,70 Q135,50 115,65 Q105,80 115,105" fill="none" stroke="#ffb6c1" stroke-width="3" stroke-dasharray="4,4" stroke-linecap="round"/>

    <!-- Body -->
    <ellipse cx="75" cy="115" rx="48" ry="42" fill="#ffffff" filter="drop-shadow(0 6px 12px rgba(0,0,0,0.4))"/>
    <ellipse cx="75" cy="120" rx="32" ry="28" fill="#fff5f8"/>

    <!-- Paws Resting in Front -->
    <ellipse cx="50" cy="142" rx="12" ry="9" fill="#ffffff" stroke="#ffd1dc" stroke-width="1.5"/>
    <ellipse cx="100" cy="142" rx="12" ry="9" fill="#ffffff" stroke="#ffd1dc" stroke-width="1.5"/>

    <!-- Head -->
    <ellipse cx="75" cy="62" rx="46" ry="38" fill="#ffffff"/>

    <!-- Ears -->
    <!-- Left Ear -->
    <path d="M38,40 Q44,4 66,24 Z" fill="#ffffff"/>
    <path d="M44,38 Q48,16 62,26 Z" fill="#ffb6c1"/>
    <!-- Right Ear -->
    <path d="M84,24 Q106,4 112,40 Z" fill="#ffffff"/>
    <path d="M88,26 Q102,16 106,38 Z" fill="#ffb6c1"/>

    <!-- Cute Birthday Party Hat -->
    <g transform="translate(62, -5)">
      <polygon points="13,28 26,-8 39,28" fill="#ff4d79"/>
      <line x1="17" y1="14" x2="35" y2="14" stroke="#ffe066" stroke-width="2.5"/>
      <line x1="20" y1="2" x2="32" y2="2" stroke="#ffffff" stroke-width="2.5"/>
      <!-- Pompom on top -->
      <circle cx="26" cy="-10" r="6.5" fill="url(#hatGlow)" filter="url(#softGlow)"/>
    </g>

    <!-- Kawaii Eyes (Big, Sparkling, Adorable) -->
    <!-- Left Eye -->
    <ellipse cx="56" cy="58" rx="8" ry="11" fill="#2d1527"/>
    <circle cx="53" cy="54" r="3.5" fill="#ffffff"/>
    <circle cx="59" cy="62" r="1.5" fill="#ffffff"/>

    <!-- Right Eye -->
    <ellipse cx="94" cy="58" rx="8" ry="11" fill="#2d1527"/>
    <circle cx="91" cy="54" r="3.5" fill="#ffffff"/>
    <circle cx="97" cy="62" r="1.5" fill="#ffffff"/>

    <!-- Rosy Glowing Blushing Cheeks -->
    <ellipse cx="44" cy="68" rx="10" ry="5.5" fill="#ff7597" opacity="0.65"/>
    <ellipse cx="106" cy="68" rx="10" ry="5.5" fill="#ff7597" opacity="0.65"/>

    <!-- Little Pink Nose & Cute Mouth -->
    <polygon points="72,64 78,64 75,68" fill="#ff4d79"/>
    <path d="M70,69 Q75,74 75,69 Q75,74 80,69" fill="none" stroke="#4a1c36" stroke-width="2" stroke-linecap="round"/>

    <!-- Whiskers -->
    <line x1="36" y1="65" x2="18" y2="62" stroke="#ffccd5" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="34" y1="72" x2="16" y2="76" stroke="#ffccd5" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="114" y1="65" x2="132" y2="62" stroke="#ffccd5" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="116" y1="72" x2="134" y2="76" stroke="#ffccd5" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Mini Star Sparkle next to cat -->
    <path d="M130,25 Q130,33 123,33 Q130,33 130,41 Q130,33 137,33 Q130,33 130,25" fill="#ffe066"/>
    <circle cx="18" cy="40" r="2.5" fill="#ffd166"/>
    <circle cx="132" cy="95" r="2" fill="#ff9ebb"/>
  </g>
</svg>
