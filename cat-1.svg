<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="catGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb6c1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffb6c1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cakeCream" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff5fa"/>
      <stop offset="100%" stop-color="#ffd1dc"/>
    </linearGradient>
    <linearGradient id="cakeBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff9ebb"/>
      <stop offset="100%" stop-color="#ff6584"/>
    </linearGradient>
    <filter id="flicker">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Aura Glow -->
  <circle cx="200" cy="200" r="180" fill="url(#catGlow1)"/>

  <!-- Cake on the Left -->
  <g transform="translate(60, 200)">
    <!-- Plate -->
    <ellipse cx="70" cy="140" rx="75" ry="18" fill="#ffeaf1" stroke="#ffb6c1" stroke-width="3"/>
    <!-- Bottom Tier -->
    <path d="M15,90 Q70,105 125,90 L125,130 Q70,145 15,130 Z" fill="url(#cakeBase)"/>
    <ellipse cx="70" cy="90" rx="55" ry="15" fill="url(#cakeCream)"/>
    <!-- Top Tier -->
    <path d="M35,50 Q70,62 105,50 L105,80 Q70,92 35,80 Z" fill="#ffb3c6"/>
    <ellipse cx="70" cy="50" rx="35" ry="10" fill="#ffffff"/>
    
    <!-- Frosting drips -->
    <path d="M35,52 Q43,65 50,53 Q58,68 67,54 Q78,67 88,53 Q96,65 105,52" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Colorful Sprinkles -->
    <circle cx="50" cy="70" r="2.5" fill="#ff4d79"/>
    <circle cx="70" cy="72" r="2.5" fill="#ffcc00"/>
    <circle cx="90" cy="68" r="2.5" fill="#a0c4ff"/>
    <circle cx="45" cy="110" r="3" fill="#ffcc00"/>
    <circle cx="75" cy="115" r="3" fill="#b9fbc0"/>
    <circle cx="100" cy="108" r="3" fill="#ffc6ff"/>

    <!-- Birthday Candles -->
    <!-- Candle 1 -->
    <rect x="52" y="22" width="6" height="28" rx="2" fill="#ffd166"/>
    <ellipse cx="55" cy="14" rx="4" ry="7" fill="#ff9f1c" filter="url(#flicker)"/>
    <ellipse cx="55" cy="15" rx="2" ry="4" fill="#ffffff"/>

    <!-- Candle 2 (Middle) -->
    <rect x="67" y="16" width="6" height="34" rx="2" fill="#ff70a6"/>
    <ellipse cx="70" cy="8" rx="5" ry="8" fill="#ff9f1c" filter="url(#flicker)"/>
    <ellipse cx="70" cy="9" rx="2.5" ry="5" fill="#ffffff"/>

    <!-- Candle 3 -->
    <rect x="82" y="22" width="6" height="28" rx="2" fill="#70d6ff"/>
    <ellipse cx="85" cy="14" rx="4" ry="7" fill="#ff9f1c" filter="url(#flicker)"/>
    <ellipse cx="85" cy="15" rx="2" ry="4" fill="#ffffff"/>
  </g>

  <!-- Kawaii Pastel Cat (Right Side, Leaning Towards Cake) -->
  <g id="catBody" transform="translate(200, 140)">
    <!-- Fluffy Tail -->
    <path d="M120,160 Q170,140 160,90 Q150,60 130,80 Q120,100 125,130" fill="none" stroke="#fff0f5" stroke-width="26" stroke-linecap="round"/>
    <path d="M120,160 Q170,140 160,90 Q150,60 130,80 Q120,100 125,130" fill="none" stroke="#ffb6c1" stroke-width="4" stroke-dasharray="8,8" stroke-linecap="round"/>

    <!-- Body -->
    <ellipse cx="75" cy="160" rx="65" ry="60" fill="#fff5f8"/>
    <!-- Belly Patch -->
    <ellipse cx="70" cy="170" rx="42" ry="38" fill="#ffeaf1"/>

    <!-- Cat Paws (Front) -->
    <ellipse cx="30" cy="195" rx="16" ry="12" fill="#ffffff" stroke="#ffccd5" stroke-width="2"/>
    <ellipse cx="75" cy="205" rx="16" ry="12" fill="#ffffff" stroke="#ffccd5" stroke-width="2"/>

    <!-- Cat Head -->
    <ellipse cx="60" cy="75" rx="62" ry="52" fill="#fff5f8"/>

    <!-- Ears -->
    <!-- Left Ear -->
    <path d="M10,48 Q18,-5 50,28 Z" fill="#fff5f8"/>
    <path d="M18,44 Q24,10 44,30 Z" fill="#ffb6c1"/>
    <!-- Right Ear -->
    <path d="M72,28 Q105,-5 112,48 Z" fill="#fff5f8"/>
    <path d="M78,30 Q98,10 104,44 Z" fill="#ffb6c1"/>

    <!-- Cute Birthday Party Hat on Cat -->
    <path d="M48,25 L65,-25 L82,25 Z" fill="#ff7597"/>
    <circle cx="65" cy="-28" r="8" fill="#ffd166"/>
    <line x1="53" y1="8" x2="77" y2="8" stroke="#ffe066" stroke-width="3"/>
    <line x1="58" y1="-8" x2="72" y2="-8" stroke="#ffffff" stroke-width="3"/>

    <!-- Kawaii Eyes (Big, Expressive, Sparkly) -->
    <!-- Left Eye -->
    <ellipse cx="38" cy="72" rx="10" ry="13" fill="#30152b"/>
    <circle cx="35" cy="67" r="4.5" fill="#ffffff"/>
    <circle cx="42" cy="77" r="2" fill="#ffffff"/>
    <!-- Right Eye -->
    <ellipse cx="78" cy="72" rx="10" ry="13" fill="#30152b"/>
    <circle cx="75" cy="67" r="4.5" fill="#ffffff"/>
    <circle cx="82" cy="77" r="2" fill="#ffffff"/>

    <!-- Rosy Blushing Cheeks -->
    <ellipse cx="24" cy="85" rx="12" ry="6" fill="#ff8da9" opacity="0.6"/>
    <ellipse cx="92" cy="85" rx="12" ry="6" fill="#ff8da9" opacity="0.6"/>

    <!-- Little Cute Pink Nose & Mouth -->
    <polygon points="56,80 62,80 59,84" fill="#ff5c8a"/>
    <path d="M54,85 Q59,90 59,85 Q59,90 64,85" fill="none" stroke="#4a223e" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Whisker lines -->
    <line x1="12" y1="80" x2="-6" y2="76" stroke="#ffb6c1" stroke-width="2" stroke-linecap="round"/>
    <line x1="10" y1="88" x2="-8" y2="92" stroke="#ffb6c1" stroke-width="2" stroke-linecap="round"/>
    <line x1="104" y1="80" x2="122" y2="76" stroke="#ffb6c1" stroke-width="2" stroke-linecap="round"/>
    <line x1="106" y1="88" x2="124" y2="92" stroke="#ffb6c1" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Sparkles around -->
  <g fill="#ffd166">
    <path d="M190,80 Q190,92 182,92 Q190,92 190,104 Q190,92 198,92 Q190,92 190,80"/>
    <path d="M340,160 Q340,170 332,170 Q340,170 340,180 Q340,170 348,170 Q340,170 340,160"/>
    <path d="M60,140 Q60,148 54,148 Q60,148 60,156 Q60,148 66,148 Q60,148 60,140"/>
  </g>
</svg>
