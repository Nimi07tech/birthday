<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="roseBloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff0f5"/>
      <stop offset="35%" stop-color="#ff8da9"/>
      <stop offset="75%" stop-color="#ff4d79"/>
      <stop offset="100%" stop-color="#b81d48"/>
    </radialGradient>
    <radialGradient id="lavenderBloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#d8b4e2"/>
      <stop offset="85%" stop-color="#9d65c9"/>
      <stop offset="100%" stop-color="#602d84"/>
    </radialGradient>
    <radialGradient id="peachBloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff9f5"/>
      <stop offset="35%" stop-color="#ffcca8"/>
      <stop offset="75%" stop-color="#ff9066"/>
      <stop offset="100%" stop-color="#d6492a"/>
    </radialGradient>
    <radialGradient id="centerGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#ffe680"/>
      <stop offset="100%" stop-color="#f5a623"/>
    </radialGradient>
    <filter id="bloomGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Big Central Romantic Rose Blossom -->
  <g transform="translate(250, 250)">
    <!-- Outer Petals Layer 1 -->
    <path d="M0,-120 C70,-130 110,-60 100,-10 C90,40 10,-20 0,-120 Z" fill="url(#roseBloom)" opacity="0.95"/>
    <path d="M120,0 C130,70 60,110 10,100 C-40,90 20,10 120,0 Z" fill="url(#roseBloom)" opacity="0.95"/>
    <path d="M0,120 C-70,130 -110,60 -100,10 C-90,-40 -10,20 0,120 Z" fill="url(#roseBloom)" opacity="0.95"/>
    <path d="M-120,0 C-130,-70 -60,-110 -10,-100 C40,-90 -20,-10 -120,0 Z" fill="url(#roseBloom)" opacity="0.95"/>

    <!-- Outer Petals Layer 2 (Rotated 45 deg) -->
    <g transform="rotate(45)">
      <path d="M0,-110 C65,-120 100,-55 90,-10 C80,35 10,-15 0,-110 Z" fill="url(#roseBloom)" opacity="0.92"/>
      <path d="M110,0 C120,65 55,100 10,90 C-35,80 15,10 110,0 Z" fill="url(#roseBloom)" opacity="0.92"/>
      <path d="M0,110 C-65,120 -100,55 -90,10 C-80,-35 -10,15 0,110 Z" fill="url(#roseBloom)" opacity="0.92"/>
      <path d="M-110,0 C-120,-65 -55,-100 -10,-90 C35,-80 -15,-10 -110,0 Z" fill="url(#roseBloom)" opacity="0.92"/>
    </g>

    <!-- Mid Petals Layer -->
    <g transform="rotate(22)">
      <path d="M0,-75 C45,-80 75,-40 65,-5 C55,25 5,-10 0,-75 Z" fill="url(#roseBloom)" opacity="0.98"/>
      <path d="M75,0 C80,45 40,75 -5,65 C-25,55 10,5 75,0 Z" fill="url(#roseBloom)" opacity="0.98"/>
      <path d="M0,75 C-45,80 -75,40 -65,-5 C-55,-25 -5,10 0,75 Z" fill="url(#roseBloom)" opacity="0.98"/>
      <path d="M-75,0 C-80,-45 -40,-75 5,-65 C25,-55 -10,-5 -75,0 Z" fill="url(#roseBloom)" opacity="0.98"/>
    </g>

    <!-- Inner Rose Heart (Swirl) -->
    <circle cx="0" cy="0" r="38" fill="url(#roseBloom)"/>
    <path d="M-20,-10 C-15,-30 15,-30 22,-10 C28,10 0,25 -15,15 C-25,5 -10,-10 5,-10 C15,-10 12,0 0,0" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
    <circle cx="0" cy="0" r="8" fill="url(#centerGold)" filter="url(#bloomGlow)"/>
  </g>

  <!-- Corner Sakura & Lavender Blooms -->
  <g transform="translate(80, 80) scale(0.45)">
    <circle cx="0" cy="0" r="60" fill="url(#lavenderBloom)"/>
    <circle cx="0" cy="0" r="16" fill="url(#centerGold)"/>
  </g>
  <g transform="translate(420, 90) scale(0.4)">
    <circle cx="0" cy="0" r="60" fill="url(#peachBloom)"/>
    <circle cx="0" cy="0" r="16" fill="url(#centerGold)"/>
  </g>
  <g transform="translate(70, 420) scale(0.4)">
    <circle cx="0" cy="0" r="60" fill="url(#peachBloom)"/>
    <circle cx="0" cy="0" r="16" fill="url(#centerGold)"/>
  </g>
  <g transform="translate(420, 410) scale(0.48)">
    <circle cx="0" cy="0" r="60" fill="url(#lavenderBloom)"/>
    <circle cx="0" cy="0" r="16" fill="url(#centerGold)"/>
  </g>
</svg>
